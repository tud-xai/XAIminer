; supervisord service for {{context.project_name}} (Uberspace 7).
;
; Uberspace 7 manages user daemons with supervisord: config files live in
; ~/etc/services.d/, and changes are picked up with `supervisorctl reread && update`.
; (Uberspace 8 replaced this with systemd user units — the equivalent template is kept
; in ../../.config/systemd/user/ for a future migration.)
;
; This file is rendered automatically from a template at {{context.time_stamp}}.
;
; Manage:  supervisorctl {start,stop,restart,status} {{context.project_name}}
; Logs:    tail -f {{context.log_file}}   (or: supervisorctl tail -f {{context.project_name}})

[program:{{context.project_name}}]
; --chdir puts deployment/ on sys.path so `wsgi:app` resolves; wsgi.py then adds xai_viewer/
; (the app is a flat script layout, not an installed package).
; Several workers because one gallery view fetches hundreds of images: with a single worker
; those requests serialise. --timeout is raised for thumbnails generated on first access.
command={{context.venv_abs_bin_path}}/gunicorn --capture-output --chdir {{context.deployment_path}}/deployment --workers 3 --timeout 60 --bind 0.0.0.0:{{context.port}} wsgi:app
directory={{context.deployment_path}}/deployment
autostart=yes
autorestart=yes
startsecs=30
stdout_logfile={{context.log_file}}
redirect_stderr=true
