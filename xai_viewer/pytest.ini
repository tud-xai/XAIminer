[pytest]
testpaths = tests
# Disable globally installed (e.g. in the conda base env) third-party plugins.
# pytest-randomly reseeds via thinc -> numpy.random.seed and crashes there at teardown;
# django/dash/langsmith also interfere with setup/teardown. Our tests need no plugins.
addopts = -p no:randomly -p no:django -p no:dash -p no:langsmith
